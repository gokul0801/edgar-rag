[project]
name = "edgar-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mangum>=0.19",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "boto3>=1.35",
    "instructor>=1.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "lancedb>=0.17",
    "sentence-transformers>=3.3",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "edgartools>=5.52.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8", "locust>=2.32"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]
